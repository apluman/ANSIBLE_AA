---
- name: Test Palo Alto API connectivity
  hosts: palo-fw
  gather_facts: no
  connection: local

  collections:
    - paloaltonetworks.panos

  tasks:
    - name: Test API connectivity
      panos_op:
        ip_address: "{{ host }}"
        username: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        cmd: "show system info"
      register: result

    - debug:
        msg: "Connected successfully to Palo Alto firewall"
