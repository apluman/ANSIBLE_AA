- name: Get Palo Alto system info
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Show system info
      paloaltonetworks.panos.panos_op:
        provider:
          ip_address: "{{ panos_ip }}"
          username: "{{ panos_user }}"
          password: "{{ panos_pass }}"
        cmd: "show system info"
