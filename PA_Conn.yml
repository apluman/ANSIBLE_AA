- name: Get Palo Alto system info
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Show system info
      paloaltonetworks.panos.panos_op:
        provider:
          ip_address: "{{ 192.168.17.128 }}"
          username: "{{ admin }}"
          password: "{{ admin }}"
        cmd: "show system info"
