- name: Get Palo Alto interface facts
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Collect interface facts
      paloaltonetworks.panos.panos_interface_facts:
        provider:
          ip_address: 192.168.17.128
          username: admin
          password: admin 
      register: interface_facts

    - name: Display interface info
      debug:
        var: interface_facts.interfaces
