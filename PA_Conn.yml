---
- name: Test connectivity to Palo Alto Firewall
  hosts: palo-fw
  gather_facts: no
  connection: local

  collections:
    - paloaltonetworks.panos

  vars:
    panos_provider:
      hostname: "{{ inventory_hostname }}"
      username: "{{ ansible_user }}"
      password: "{{ ansible_password }}"

 tasks:
    - name: Test API connectivity by gathering facts
      panos_facts:
        provider: "{{ panos_provider }}"
      register: panos_result

    - name: Connectivity success
      debug:
        msg: >
          Connected to {{ panos_result.ansible_facts.net_hostname }}
          running PAN-OS {{ panos_result.ansible_facts.net_version }}
