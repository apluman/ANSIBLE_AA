---
- name: Get Palo Alto info
  hosts: 192.168.17.128
  gather_facts: no
  collections:
    - paloaltonetworks.panos
  tasks:
    - name: Get firewall facts
      panos_op:
        provider:
          ip_address: "{{ inventory_hostname }}"
          username: "{{ ansible_user }}"
          password: "{{ ansible_password }}"
        cmd: "show system info"
      register: result

    - debug:
        var: result
