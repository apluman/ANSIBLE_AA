---
- name: Test Palo Alto API connectivity
  hosts: firewalls
  gather_facts: no
  collections:
    - paloaltonetworks.panos

  vars:
    provider:
      ip_address: "{{ ansible_host }}"
      username: "api_user"
      password: "api_password"

  tasks:
    - name: Get system info from Palo Alto
      panos_facts:
        provider: "{{ provider }}"
      register: result

    - name: Show system info
      debug:
        var: result
