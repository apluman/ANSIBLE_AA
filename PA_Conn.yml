- name: Check Palo Alto connectivity and get hostname
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run 'show system info' command
      paloaltonetworks.panos.panos_op:
        provider:
          ip_address: 192.168.17.128      # Replace with your firewall IP
          username: admin                 # Replace with your username
          password: admin                 # Replace with your password
        cmd: "show system info"
      register: system_info

    - name: Display hostname
      debug:
        msg: "Palo Alto hostname is: {{ system_info.stdout | from_json | json_query('response.result.hostname') }}"
