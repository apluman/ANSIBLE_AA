- name: Palo Alto connectivity test
  hosts: 172.19.152.186
  connection: local
  gather_facts: no

  collections:
    - paloaltonetworks.panos

  vars:
    provider:
      ip_address: "{{ 172.19.152.186 }}"
      api_key: "{{ ansible_password }}"

  tasks:
    - name: Get firewall system info
      panos_facts:
        provider: "{{ provider }}"
