- name: Palo Alto connectivity test
  hosts: pa-fw-ANOT_LAB
  connection: local
  gather_facts: no

  collections:
    - paloaltonetworks.panos

  vars:
    provider:
      ip_address: "{{ ansible_host }}"
      api_key: "{{ ansible_password }}"

  tasks:
    - name: Get firewall system info
      panos_facts:
        provider: "{{ provider }}"
